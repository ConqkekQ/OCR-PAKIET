name: Budowanie programu

# Nowa wersja: Releases -> "Draft a new release" -> tag np. v0.3.0 -> Publish release.
# Po kilku minutach instalator i .exe same doczepią się do tego wydania.
# Ręcznie: zakładka Actions -> "Budowanie programu" -> Run workflow (pliki w Artifacts).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zależności
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Testy logiki
        run: python -m pytest -q tests

      - name: Wersja
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "release") { $v = "${{ github.ref_name }}".TrimStart("v") }
          else { $v = "0.0.${{ github.run_number }}" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Metadane pliku .exe (autor, wersja)
        run: python narzedzia/wersja_exe.py ${{ steps.ver.outputs.version }} version_info.txt

      - name: Budowanie OCR-PAKIET.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name OCR-PAKIET
          --icon assets/ikona.ico --version-file version_info.txt
          --add-data "pakiety_szablon.xlsx;."
          --add-data "assets/ikona.ico;assets"
          --collect-all winrt --hidden-import win32timezone
          --distpath dist start.py

      - name: Test odczytu (kod źródłowy i gotowy .exe)
        shell: pwsh
        run: |
          function Notice($title, $text) {
            $t = ($text -replace "%", "%25") -replace "`r?`n", "%0A"
            Write-Host "::notice title=$title::$t"
          }
          python tests/syntetyczny_zs.py syn.png | Out-Null
          # w teście używamy szablonu pakietów zamiast dysku Z:
          '{"plik_pakietow": "pakiety.xlsx"}' | Set-Content config.json -Encoding utf8
          Copy-Item config.json dist\config.json
          $src = (python -m ocr_pakiet --obraz syn.png 2>&1 | Out-String)
          Notice "Test z kodu (exit $LASTEXITCODE)" $src
          Start-Process -FilePath dist\OCR-PAKIET.exe -ArgumentList "--obraz","syn.png","--wynik","wynik.txt" -Wait
          $out = if (Test-Path wynik.txt) { Get-Content wynik.txt -Raw -Encoding utf8 } else { "(NIE_MA_WYNIKU)" }
          Notice "Test pliku .exe" $out
          if ($out -match "Traceback|No module named|ModuleNotFoundError|NIE_MA_WYNIKU") {
            Write-Host "::error::Plik .exe nie uruchomił się poprawnie"; exit 1
          }
          if ($out -notmatch "MREKLATS100") {
            Write-Host "::warning::OCR na serwerze GitHuba nie odczytał listy – sprawdź na komputerze z Windows 10/11"
          }
          exit 0

      - name: Test odczytu prawdziwych zrzutów XL (Windows OCR)
        shell: pwsh
        run: |
          function Notice($title, $text) {
            $t = ($text -replace "%", "%25") -replace "`r?`n", "%0A"
            Write-Host "::notice title=$title::$t"
          }
          # pakiety testowe z kodami towarów widocznych na zrzutach (sprawdza też ponowny odczyt wiersza)
          $pk = (Resolve-Path tests\dane\pakiety_test.xlsx).Path.Replace('\','\\')
          "{`"plik_pakietow`": `"$pk`"}" | Set-Content dist\config.json -Encoding utf8
          foreach ($f in Get-ChildItem tests\zrzuty\*.png) {
            Remove-Item wynik.txt -ErrorAction SilentlyContinue
            Start-Process -FilePath dist\OCR-PAKIET.exe -ArgumentList "--obraz",$f.FullName,"--wynik","wynik.txt" -Wait
            $out = if (Test-Path wynik.txt) { Get-Content wynik.txt -Raw -Encoding utf8 } else { "(NIE_MA_WYNIKU)" }
            Notice "Zrzut XL: $($f.Name)" $out
          }

      - name: Test okna ZS wewnątrz okna programu (jak w XL)
        shell: pwsh
        run: |
          function Notice($title, $text) {
            $t = ($text -replace "%", "%25") -replace "`r?`n", "%0A"
            Write-Host "::notice title=$title::$t"
          }
          $wyniki = @{}
          foreach ($przypadek in @("zs", "lista")) {
            $a = @("-NoProfile", "-File", "tests/okno_mdi.ps1", "-Obraz", "syn.png")
            if ($przypadek -eq "lista") { $a += "-AktywnaLista" }
            $form = Start-Process pwsh -ArgumentList $a -PassThru
            Start-Sleep -Seconds 4
            Remove-Item live.txt -ErrorAction SilentlyContinue
            Start-Process -FilePath dist\OCR-PAKIET.exe -ArgumentList "--sprawdz-okno","--wynik","live.txt" -Wait
            Stop-Process -Id $form.Id -Force -ErrorAction SilentlyContinue
            $out = if (Test-Path live.txt) { Get-Content live.txt -Raw -Encoding utf8 } else { "(NIE_MA_WYNIKU)" }
            Notice "Okno w oknie: aktywny dokument = $przypadek" $out
            $wyniki[$przypadek] = $out
          }
          if (($wyniki.Values -join "") -match "Traceback|NIE_MA_WYNIKU") {
            Write-Host "::error::Test okna zakończył się błędem"; exit 1
          }
          if ($wyniki["zs"] -notmatch "Znalezione ZS") { Write-Host "::warning::Nie znaleziono ZS wewnątrz okna programu" }
          if ($wyniki["lista"] -notmatch "NIE ZNALEZIONO") { Write-Host "::warning::ZS uznane za aktywne, choć aktywna była lista" }
          exit 0

      - name: Podgląd okienka (zrzut)
        shell: pwsh
        run: |
          Start-Process -FilePath dist\OCR-PAKIET.exe -ArgumentList "--podglad","podglad.png","--wynik","podglad.txt" -Wait
          if (Test-Path podglad.txt) { Get-Content podglad.txt }
          if (-not (Test-Path podglad.png)) { Write-Host "::error::Brak zrzutu podglądu"; exit 1 }

      - name: Podgląd na gałąź ci-podglad (do obejrzenia bez logowania do Actions)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $png = (Resolve-Path podglad.png).Path
          $tmp = Join-Path $env:RUNNER_TEMP "podglad"
          git clone --quiet --no-checkout "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" $tmp
          Set-Location $tmp
          git checkout --quiet --orphan ci-podglad
          git rm -rf --quiet . 2>$null
          Copy-Item $png podglad.png
          git add podglad.png
          git -c user.name="ci" -c user.email="ci@localhost" commit --quiet -m "Podgląd okienka (${{ github.sha }})"
          git push --quiet --force origin ci-podglad

      - name: Instalator (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" instalator\ocr-pakiet.iss

      - uses: actions/upload-artifact@v4
        with:
          name: OCR-PAKIET-${{ steps.ver.outputs.version }}
          path: |
            dist/OCR-PAKIET-Setup.exe
            dist/OCR-PAKIET.exe

      - name: Wydanie (Release)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/OCR-PAKIET-Setup.exe
            dist/OCR-PAKIET.exe
          append_body: true
          body: |

            **Instalacja:** pobierz `OCR-PAKIET-Setup.exe`, uruchom i klikaj „Dalej”. Nie potrzeba uprawnień administratora.
            Wersja przenośna bez instalacji: `OCR-PAKIET.exe`.
